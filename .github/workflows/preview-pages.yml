name: Publish YOYO LIVE safe preview
on:
  push:
    branches:
      - feature/livekit-live-stream
    paths:
      - "preview-site/**"
      - ".github/workflows/preview-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/livekit-live-stream
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload safe demo preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview-site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
