name: Verify YOYO LIVE LiveKit integration

on:
  push:
    branches:
      - feature/livekit-live-stream
    paths:
      - "YoyoLiveApp/App.js"
      - "YoyoLiveApp/AccountScreen.js"
      - "YoyoLiveApp/AuthScreen.js"
      - "YoyoLiveApp/ProfileScreen.js"
      - "YoyoLiveApp/public/**"
      - "supabase/functions/delete-account/**"
      - "supabase/functions/livekit-token/**"
      - "supabase/migrations/**"
      - "YoyoLiveApp/ChatScreen.js"
      - "YoyoLiveApp/eas.json"
      - "YoyoLiveApp/LiveRoomScreen.native.js"
      - "YoyoLiveApp/LiveRoomScreen.web.js"
      - "YoyoLiveApp/registerLiveKit.native.js"
      - "YoyoLiveApp/registerLiveKit.web.js"
      - "YoyoLiveApp/public/delete-account.html"
      - "YoyoLiveApp/package.json"
      - "YoyoLiveApp/app.json"
      - ".github/workflows/verify-livekit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yoyo-livekit-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: YoyoLiveApp
    steps:
      - name: Check out YOYO LIVE
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: YoyoLiveApp/package-lock.json

      - name: Install JavaScript dependencies and refresh lockfile
        run: npm install --no-audit --no-fund

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: Verify web preview fallback
        run: npx expo export --platform web

      - name: Verify external account deletion page is exported
        run: |
          test -f dist/delete-account.html
          test -f dist/privacy-policy.html
          test -f dist/terms.html
          grep -q "delete-account" dist/delete-account.html
          grep -q "YOYO LIVE" dist/privacy-policy.html
          grep -q "شروط الاستخدام" dist/terms.html

      - name: Generate Android native project and apply LiveKit config plugins
        run: npx expo prebuild --platform android --no-install

      - name: Check generated Android target API
        run: |
          grep -R "targetSdkVersion" android
          TARGET=$(grep -R "targetSdkVersion" android | grep -oE "[0-9]+" | sort -nr | head -n1)
          echo "Generated target SDK: $TARGET"
          test -n "$TARGET" && test "$TARGET" -ge 36

      - name: Run Expo diagnostics
        run: npx expo-doctor

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check account deletion Edge Function
        working-directory: .
        run: deno check supabase/functions/delete-account/index.ts supabase/functions/livekit-token/index.ts

      - name: Commit the generated dependency lockfile
        working-directory: .
        run: |
          if ! git diff --quiet -- YoyoLiveApp/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add YoyoLiveApp/package-lock.json
            git commit -m "[bot] refresh LiveKit dependency lock"
            git push
          fi
