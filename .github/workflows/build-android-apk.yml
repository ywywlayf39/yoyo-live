name: Build YOYO LIVE Android release APK

on:
  push:
    branches:
      - fix/production-android-build
    paths:
      - "YoyoLiveApp/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build and verify YOYO LIVE release APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: YoyoLiveApp
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: YoyoLiveApp/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install

      - name: Prepare YOYO LIVE app icon
        run: |
          npm install --no-save --package-lock=false sharp
          node -e "require('sharp')('assets/yoyo-live-icon.svg').resize(1024, 1024).png().toFile('assets/yoyo-live-icon.png')"

      - name: Validate Expo production config
        run: |
          npx expo config --type public > /tmp/yoyo-expo-config.json
          node -e "const c=require('/tmp/yoyo-expo-config.json'); if(c.updates?.useNativeDebug===true) throw new Error('Native debug mode must be disabled'); console.log('Production Expo config validated')"

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Android release APK
        working-directory: YoyoLiveApp/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Align and sign APK for device testing
        working-directory: YoyoLiveApp/android
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p app/build/outputs/verified
          ALIGNED="app/build/outputs/verified/YOYO-LIVE-aligned.apk"
          FINAL="app/build/outputs/verified/YOYO-LIVE.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -v 4 "$APK" "$ALIGNED"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$ALIGNED" >/dev/null 2>&1; then
            cp "$ALIGNED" "$FINAL"
          else
            KEY="$HOME/.android/yoyo-test-release.keystore"
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$KEY" -storepass android -alias yoyo-test -keypass android -dname "CN=YOYO LIVE Test Build" -keyalg RSA -keysize 2048 -validity 10000
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$KEY" --ks-key-alias yoyo-test --ks-pass pass:android --key-pass pass:android --out "$FINAL" "$ALIGNED"
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$FINAL"
          ls -lh "$FINAL"

      - name: Upload verified YOYO LIVE release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoyo-live-release-apk
          path: YoyoLiveApp/android/app/build/outputs/verified/YOYO-LIVE.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/verified/YOYO-LIVE.apk"
          TAG="android-release-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK#YOYO-LIVE.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "YOYO LIVE device test build ${GITHUB_RUN_NUMBER}" \
            --notes "Release-variant APK for device testing. Signed for testing only; not the Google Play production signing key. Built from commit ${GITHUB_SHA}."
