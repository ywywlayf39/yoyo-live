name: Build YOYO LIVE Android APK

on:
  push:
    branches:
      - feature/livekit-live-stream
    paths:
      - "YoyoLiveApp/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build installable Android debug APK locally
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: YoyoLiveApp
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: YoyoLiveApp/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Prepare YOYO LIVE app icon
        run: |
          npm install --no-save --package-lock=false sharp
          node -e "require('sharp')('assets/yoyo-live-icon.svg').resize(1024, 1024).png().toFile('assets/yoyo-live-icon.png')"

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Build installable debug APK
        working-directory: YoyoLiveApp/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload YOYO LIVE APK
        uses: actions/upload-artifact@v4
        with:
          name: yoyo-live-android-debug-apk
          path: YoyoLiveApp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
