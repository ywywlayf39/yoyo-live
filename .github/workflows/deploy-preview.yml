name: Publish YOYO LIVE preview

on:
  push:
    branches:
      - feature/livekit-live-stream
    paths:
      - "YoyoLiveApp/**"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yoyo-live-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YoyoLiveApp
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: YoyoLiveApp/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Export web preview
        run: npx expo export --platform web

      - name: Verify preview output
        run: |
          test -s dist/index.html
          test -d dist/assets
          echo "Web preview exported successfully."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: YoyoLiveApp/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
